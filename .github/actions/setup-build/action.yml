name: Setup build
description: Set up JDKs and Gradle

runs:
  using: composite
  steps:
  - name: Set up JDK
    uses: actions/setup-java@v6.1.0
    with:
      distribution: temurin
      java-version: |
        21
        25

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6.4.0
    with:
      add-job-summary: on-failure
